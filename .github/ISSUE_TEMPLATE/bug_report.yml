name: Bug Report
description: Create a report to help us reproduce and fix a defect in Ban4Life.
title: "fix(<scope>): <short description of the issue>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please fill out this form as completely as possible to facilitate debugging and resolution.
  - type: dropdown
    id: package
    attributes:
      label: Affected Component
      description: Select the primary package or application where the bug occurs.
      options:
        - apps/api (Backend, Moderation, Baileys, SQLite)
        - apps/web (Frontend Dashboard, SSE Feed)
        - packages/types (Domain Interfaces)
        - Deployment / Docker Configuration
        - CI / Tooling
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Start the service with...
        2. Send incoming payload containing...
        3. Observe error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Paste any server output, container logs, or stack traces here.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment Details
      description: Node version, Docker version, OS distribution.
      placeholder: "e.g., Node 20.12.0, Docker 26.1, Ubuntu 22.04"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Verification
      options:
        - label: I have searched existing issues and verified this is not a duplicate.
          required: true
        - label: I have verified that this issue does not contain sensitive credentials, API keys, or private phone numbers.
          required: true
