version: '3.8'

services:
  linkeshield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkeshield-bot
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - ADMIN_PASSWORD=sua_senha_secreta_aqui
      - TYPESAFE_API_KEY=sua_chave_typesafe_aqui
      - DATABASE_URL=file:/app/data/linkeshield.db
    volumes:
      - ./data:/app/data
