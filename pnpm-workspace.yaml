packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@nestjs/core': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true

blockExoticSubdeps: false

onlyBuiltDependencies:
  - '@nestjs/core'
  - 'better-sqlite3'
  - 'esbuild'
  - 'protobufjs'

patchedDependencies:
  '@whiskeysockets/baileys': patches/@whiskeysockets__baileys.patch
